<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EFA26 Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>EFA26 Planner</h1>
    <p>Kalender-Builder für das European Forum Alpbach 2026</p>
  </header>

  <main>
    <div class="sync-panel">
      <label>
        Dein Name:
        <input id="user-name" type="text" placeholder="z.B. Anna" />
      </label>
      <button id="sync-button" type="button">Mit Club synchronisieren</button>
      <span id="sync-status"></span>
    </div>

    <div class="status-bar">
      <p id="status">Lade Events …</p>
      <button id="export-ics" type="button" disabled>Auswahl als .ics exportieren</button>
    </div>
    <div id="filters" class="filters"></div>
    <div id="events"></div>
  </main>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EFA26 Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-main">
      <h1 id="home-link" role="button" tabindex="0">EFA26 Planner</h1>
      <p data-i18n="subtitle">Kalender-Builder für das European Forum Alpbach 2026</p>
    </div>
    <div class="lang-switch">
      <button id="lang-de" type="button" class="view-switch-btn active">DE</button>
      <button id="lang-en" type="button" class="view-switch-btn">EN</button>
    </div>
  </header>

  <main>
    <div class="sync-panel">
      <label>
        <span data-i18n="yourName">Dein Name:</span>
        <input id="user-name" type="text" data-i18n-placeholder="namePlaceholder" placeholder="z.B. Anna" />
      </label>
      <button id="sync-button" type="button" data-i18n="syncButton">Mit Club synchronisieren</button>
      <span id="sync-status"></span>
    </div>

    <div class="status-bar">
      <p id="status" data-i18n="loadingEvents">Lade Events …</p>
      <div class="status-bar-actions">
        <button id="clear-selection" type="button" disabled data-i18n="clearSelection">Auswahl leeren</button>
        <button id="export-ics" type="button" disabled data-i18n="exportIcs">Auswahl als .ics exportieren</button>
      </div>
    </div>

    <div class="view-switch">
      <button id="view-list" type="button" class="view-switch-btn active" data-i18n="viewList">
        Alle Events
      </button>
      <button id="view-calendar" type="button" class="view-switch-btn" data-i18n="viewCalendar">
        Meine Auswahl (Kalender)
      </button>
    </div>

    <div id="list-view">
      <input
        id="search"
        type="search"
        class="search-box"
        data-i18n-placeholder="searchPlaceholder"
        placeholder="Suche nach Titel, Beschreibung, Speaker:in, Location …"
      />
      <details id="filters-details" open>
        <summary data-i18n="filtersSummary">Filter</summary>
        <div id="filters" class="filters"></div>
      </details>
      <div id="events"></div>
    </div>

    <div id="calendar-view" hidden>
      <div class="calendar-toolbar">
        <div class="calendar-nav">
          <button id="calendar-prev" type="button" data-i18n-aria-label="prev" aria-label="Zurück">←</button>
          <h2 id="calendar-range-label"></h2>
          <button id="calendar-next" type="button" data-i18n-aria-label="next" aria-label="Weiter">→</button>
        </div>
        <div class="calendar-mode-switch">
          <button id="calendar-mode-day" type="button" class="view-switch-btn active" data-i18n="calendarModeDay">
            Tag
          </button>
          <button id="calendar-mode-week" type="button" class="view-switch-btn" data-i18n="calendarModeWeek">
            Woche
          </button>
        </div>
      </div>
      <label class="calendar-viewer">
        <span data-i18n="calendarViewerLabel">Kalender von:</span>
        <select id="calendar-viewer-select">
          <option value="" data-i18n="calendarViewerMe">Ich (lokale Auswahl)</option>
        </select>
      </label>
      <p id="calendar-summary"></p>
      <div id="calendar-allday"></div>
      <div id="calendar-grid"></div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
